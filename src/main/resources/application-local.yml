spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:${DB_PORT:3307}/udt?connectionTimeZone=+09:00&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:udt}
    password: ${SPRING_DATASOURCE_PASSWORD:udt}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: +09:00
  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
