spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:${DB_PORT:3307}/udt?connectionTimeZone=+09:00&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:udt}
    password: ${SPRING_DATASOURCE_PASSWORD:udt}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: +09:00
  sql:
    init:
      mode: always
      # data.sql은 UTF-8이다. 지정하지 않으면 JVM 기본 인코딩으로 읽어
      # 터미널(mvn spring-boot:run)로 띄울 때 시드 한글이 깨진 채 INSERT된다.
      encoding: UTF-8

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
