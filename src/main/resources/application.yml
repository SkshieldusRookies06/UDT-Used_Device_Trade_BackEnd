spring:
  application:
    name: udt
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: always
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
    # default_batch_fetch_size 는 T-019(N+1 튜닝)에서 넣는다.
    # 미리 넣으면 '개선 전' 쿼리 로그를 찍을 수 없다.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  data:
    web:

server:
  port: ${PORT:8080}

app:
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:udt-local-development-secret-key-change-me-32bytes}
    expiration-seconds: 86400
