<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{layout/base :: head('상품 검수')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main>
    <h1>검수 대기 상품</h1>
    <p class="error" th:if="${rejectError}" th:text="${rejectError}"></p>
    <p class="error" th:if="${approveError}" th:text="${approveError}"></p>
    <p class="error" th:if="${adminError}" th:text="${adminError}"></p>

    <table>
        <thead>
        <tr><th>상품</th><th>판매자</th><th>가격</th><th>등록일</th><th>처리</th></tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.title}"></td>
            <td th:text="${p.sellerNickname}"></td>
            <td th:text="${p.priceKrw}"></td>
            <td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <form th:action="@{/admin/products/{id}/approve(id=${p.id})}" method="post" style="display:inline">
                    <button type="submit">승인</button>
                </form>
                <form th:action="@{/admin/products/{id}/reject(id=${p.id})}" method="post" style="display:inline">
                    <input type="text" name="reason" placeholder="반려 사유">
                    <button type="submit">반려</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(products)}"><td colspan="5">검수 대기 중인 상품이 없습니다.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
