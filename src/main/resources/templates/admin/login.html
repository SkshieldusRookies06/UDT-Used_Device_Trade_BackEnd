<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{layout/base :: head('로그인')}"></head>
<body>
<main>
  <h1>관리자 로그인</h1>
  <p class="error" th:if="${param.error}">이메일 또는 비밀번호가 올바르지 않습니다</p>
  <form th:action="@{/admin/login}" method="post">
    <p><input type="email" name="username" placeholder="이메일" required></p>
    <p><input type="password" name="password" placeholder="비밀번호" required></p>
    <button type="submit">로그인</button>
  </form>
</main>
</body>
</html>
