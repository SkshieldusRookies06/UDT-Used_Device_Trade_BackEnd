<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{layout/base :: head('분쟁 처리')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav}"></header>
<main>
  <h1>분쟁 목록</h1>
  <table>
    <thead>
      <tr><th>거래</th><th>신고자</th><th>사유</th><th>증빙</th><th>처리</th></tr>
    </thead>
    <tbody>
      <tr th:each="d : ${disputes}">
        <td th:text="${d.transactionId}"></td>
        <td th:text="${d.reporterNickname}"></td>
        <td th:text="${d.reason}"></td>
        <td>
          <a th:each="f : ${d.files}"
             th:href="@{/api/disputes/{did}/files/{fid}(did=${d.id}, fid=f.id)}"
             th:text="${f.originalName}"></a>
        </td>
        <td>
          <form th:action="@{/admin/disputes/{id}/refund(id=${d.id})}" method="post" style="display:inline">
            <button type="submit">강제 환불</button>
          </form>
          <form th:action="@{/admin/disputes/{id}/confirm(id=${d.id})}" method="post" style="display:inline">
            <button type="submit">강제 확정</button>
          </form>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(disputes)}"><td colspan="5">처리할 분쟁이 없습니다.</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
