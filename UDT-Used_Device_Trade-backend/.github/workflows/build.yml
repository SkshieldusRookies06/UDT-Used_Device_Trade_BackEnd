# PR마다 컴파일 + 컨텍스트 기동 테스트. 게이트(seams/)는 서버가 떠 있어야 해서 여기서 안 돈다 — PR 본문에 붙인다.
name: build
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: udt
          MARIADB_USER: udt
          MARIADB_PASSWORD: udt
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & test
        run: mvn -B test
